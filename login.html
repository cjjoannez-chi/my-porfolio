<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome Back</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-card">
     
        <!-- TOP ICON -->
        <div class="sun-icon">☼</div>

        <!-- TITLE -->
        <h1>Welcome back!</h1>

        <p class="subtitle">
            Sign in to access your guided meditations, daily practices,<br>
            and personal journey
        </p>


        <!-- EMAIL -->
        <label>Email</label>

        <input 
            type="email" 
            placeholder="Enter your email"
        >


        <!-- PASSWORD -->
        <label>Password</label>

        <div class="password-box">

            <input 
                type="password" 
                value="123456"
            >

            <span class="eye">◉</span>

        </div>


        <!-- REMEMBER / FORGOT -->
        <div class="options">

            <label class="remember">
                <input type="checkbox" checked>
                <span>Remember me</span>
            </label>

            <a href="#">Forgot password?</a>

        </div>


        <!-- LOGIN BUTTON -->
        <button class="login-btn">
            Log In
        </button>


        <!-- OR -->
        <div class="or">
            <span></span>
            <p>Or</p>
            <span></span>
        </div>


        <!-- GOOGLE -->
        <button class="google-btn">

            <span class="google-icon">G</span>

            Sign in with Google

        </button>


        <!-- SIGN UP -->
        <p class="signup">
            Don't have an account?
            <a href="#">Sign Up</a>
        </p>

    </div>

</body>
</html>
