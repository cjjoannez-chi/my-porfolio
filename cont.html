<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Me</title>

    <link rel="stylesheet" href="cont.css">
</head>

<body>

    <div class="contact-page">

        <!-- IMAGE SIDE -->
        <div class="image-side">

            <img src="10 hour 4k fast moving metallic pink color Relaxing Neon light abstract background video, animation.jpeg" alt="Neon pink background">

            <div class="image-text">
                <p>LET'S CREATE</p>

                <h1>
                    Let's bring<br>
                    your ideas<br>
                    to life.
                </h1>

                <span>
                    Web Design • Development • Creative Solutions
                </span>
            </div>

        </div>


        <!-- FORM SIDE -->
        <div class="form-side">

            <div class="form-header">
                <p>MAKE A CONNECTION</p>

                <h1>
                    Let's chat.<br>
                    Tell me about your project
                </h1>
            </div>


            <form>

                <!-- NAME + EMAIL -->
                <div class="form-row">

                    <div class="input-group">
                        <label>
                            Full Name<span>*</span>
                        </label>

                        <input
                            type="text"
                            placeholder="Your full name"
                        >
                    </div>


                    <div class="input-group">
                        <label>
                            Email address<span>*</span>
                        </label>

                        <input
                            type="email"
                            placeholder="name@example.com"
                        >
                    </div>

                </div>


                <!-- PHONE -->
                <div class="input-group full">

                    <label>
                        Contact No.<span>*</span>
                    </label>

                    <input
                        type="tel"
                        placeholder="+234 123 456 7890"
                    >

                </div>


                <!-- ADDRESS -->
                <div class="input-group full">

                    <label>
                        Address<span>*</span>
                    </label>

                    <textarea
                        placeholder="Enter your address"
                    ></textarea>

                </div>


                <!-- COUNTRY + STATE -->
                <div class="form-row">

                    <div class="input-group">

                        <label>
                            Where is your company based?
                        </label>

                        <select>
                            <option>Select your country</option>
                            <option>Nigeria</option>
                            <option>United Kingdom</option>
                            <option>United States</option>
                            <option>Canada</option>
                        </select>

                    </div>


                    <div class="input-group">

                        <label>&nbsp;</label>

                        <input
                            type="text"
                            placeholder="State"
                        >

                    </div>

                </div>


                <!-- CITY + ZIP -->
                <div class="form-row">

                    <div class="input-group">

                        <input
                            type="text"
                            placeholder="City"
                        >

                    </div>


                    <div class="input-group">

                        <input
                            type="text"
                            placeholder="Zip-code"
                        >

                    </div>

                </div>


                <!-- DATE -->
                <div class="input-group full">

                    <label>
                        Date picker<span>*</span>
                    </label>

                    <input type="date">

                </div>


                <!-- TIME -->
                <div class="input-group full">

                    <label>
                        Time picker<span>*</span>
                    </label>

                    <input type="time">

                </div>


                <!-- PROJECT TYPE -->
                <div class="input-group full">

                    <label>
                        What service do you need?
                    </label>

                    <select>

                        <option>Select a service</option>

                        <option>Web Design</option>

                        <option>Web Development</option>

                        <option>UI/UX Design</option>

                        <option>Website Redesign</option>

                    </select>

                </div>


                <!-- MESSAGE -->
                <div class="input-group full">

                    <label>
                        Tell me about your project
                    </label>

                    <textarea
                        class="message"
                        placeholder="Write a short description of your project..."
                    ></textarea>

                </div>


                <!-- SUBMIT -->
                <button type="submit" class="submit-btn">
                    Send Message
                </button>

            </form>

        </div>

    </div>

</body>
</html>
